name: db-mobile-resonance
base: core22
version: '3.5.3'
title: Resonance
summary: Test and explore web services
description: |
  Resonance is a local-first, zero-account API client application designed to provide
  an excellent user experience for testing and interacting with web services.

  Features:
  - REST/HTTP (HTTP/1.1 and HTTP/2) with all body modes, detailed timing breakdown and cookie display
  - GraphQL with query and variables editors, schema introspection, an interactive query explorer and subscriptions over WebSocket
  - gRPC with server reflection, local .proto files, all four RPC kinds and TLS/mTLS
  - WebSocket, Server-Sent Events and MQTT connections with live status
  - Import from OpenAPI 3.x, Swagger 2.0, Postman, Insomnia, HAR captures and cURL commands; export to OpenAPI and Postman
  - Code generation in 9 languages and Markdown/HTML documentation generation
  - Built-in mock server with response templating, custom bodies, status codes and delays
  - Pre-request and test scripts in sandboxed JavaScript with a Postman-compatible pm API
  - Collection runner with data files, request tags, run history and JSON/JUnit XML reports
  - Response schema validation (JSON Schema drafts 4 to 2020-12) and JSONPath/XPath inspection
  - Environments with variable templating and dynamic variables
  - Bearer, Basic, API key, OAuth 2.0 with automatic refresh, Digest, NTLM and AWS Signature v4 authentication
  - Client certificates (mTLS), keychain-backed secrets and HTTP/HTTPS/SOCKS proxy support
  - Git-friendly collections stored as plain files, with the current branch shown in the sidebar
  - Workspace tabs, request history with search and replay, and keyboard shortcuts for everything
  - Light, dark and system themes with 9 accent colours
  - Available in English, German, Spanish, French, Italian and Portuguese (BR)

grade: stable
confinement: strict
icon: assets/icons/icon_256x256.png

contact: mailto:dennis.bluemer@ducart.de
license: MIT
website: https://db-mobile.github.io/resonance
source-code: https://github.com/db-mobile/resonance
issues: https://github.com/db-mobile/resonance/issues

layout:
  /usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/webkit2gtk-4.1:
    bind: $SNAP/usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/webkit2gtk-4.1
  /usr/share/libdrm:
    bind: $SNAP/graphics/libdrm
  /usr/share/drirc.d:
    symlink: $SNAP/graphics/drirc.d
  /usr/share/X11/XErrorDB:
    symlink: $SNAP/graphics/X11/XErrorDB
  /usr/share/X11/locale:
    symlink: $SNAP/graphics/X11/locale

architectures:
  - build-on: [amd64]
    build-for: [amd64]
  - build-on: [arm64]
    build-for: [arm64]

apps:
  db-mobile-resonance:
    command-chain:
      - bin/graphics-core22-wrapper
    command: usr/bin/resonance
    desktop: usr/share/applications/io.github.db_mobile.resonance.desktop
    extensions: [gnome]
    plugs:
      - graphics-core22
      - desktop
      - desktop-legacy
      - x11
      - wayland
      - opengl
      - gsettings
      - network
      - network-bind
      - password-manager-service

package-repositories:
  - type: apt
    components: [main]
    suites: [noble]
    key-id: 78E1918602959B9C59103100F1831DDAFC42E99D
    url: http://ppa.launchpad.net/snappy-dev/snapcraft-daily/ubuntu

plugs:
  graphics-core22:
    interface: content
    target: $SNAP/graphics
    default-provider: mesa-core22

parts:
  db-mobile-resonance:
    plugin: dump
    build-snaps:
      - node/22/stable
      - rustup/latest/stable
    build-packages:
      - curl
      - wget
      - file
      - librsvg2-dev
      - libwebkit2gtk-4.1-dev
      - build-essential
      - libxdo-dev
      - dpkg
    stage-packages:
      - libwebkit2gtk-4.1-0
      - libproxy1v5
    source: .
    override-build: |
      set -eu
      rustup default stable
      npm install
      TAURI_SIGNING_PRIVATE_KEY="" npm run tauri build -- --bundles deb -c '{"bundle":{"createUpdaterArtifacts":false}}'
      dpkg -x target/release/bundle/deb/*.deb $SNAPCRAFT_PART_INSTALL/

      mkdir -p $CRAFT_PART_INSTALL/usr/share/applications
      cp assets/desktop/io.github.db_mobile.resonance.desktop $CRAFT_PART_INSTALL/usr/share/applications/io.github.db_mobile.resonance.desktop
      sed -i 's/^Exec=.*/Exec=resonance/' $CRAFT_PART_INSTALL/usr/share/applications/io.github.db_mobile.resonance.desktop
      sed -i 's/^Icon=.*/Icon=io.github.db_mobile.resonance/' $CRAFT_PART_INSTALL/usr/share/applications/io.github.db_mobile.resonance.desktop

      # Install icons
      mkdir -p $CRAFT_PART_INSTALL/usr/share/icons/hicolor/32x32/apps
      mkdir -p $CRAFT_PART_INSTALL/usr/share/icons/hicolor/128x128/apps
      mkdir -p $CRAFT_PART_INSTALL/usr/share/icons/hicolor/256x256/apps
      mkdir -p $CRAFT_PART_INSTALL/usr/share/icons/hicolor/512x512/apps
      cp assets/icons/icon_32x32.png $CRAFT_PART_INSTALL/usr/share/icons/hicolor/32x32/apps/io.github.db_mobile.resonance.png
      cp assets/icons/icon_128x128.png $CRAFT_PART_INSTALL/usr/share/icons/hicolor/128x128/apps/io.github.db_mobile.resonance.png
      cp assets/icons/icon_256x256.png $CRAFT_PART_INSTALL/usr/share/icons/hicolor/256x256/apps/io.github.db_mobile.resonance.png
      cp assets/icons/icon_512x512.png $CRAFT_PART_INSTALL/usr/share/icons/hicolor/512x512/apps/io.github.db_mobile.resonance.png

  graphics-core22:
    after: [db-mobile-resonance]
    source: https://github.com/canonical/gpu-snap.git
    plugin: dump
    override-prime: |
      craftctl default
      ${CRAFT_PART_SRC}/bin/graphics-core22-cleanup mesa-core22 nvidia-core22
      mkdir -p "${CRAFT_PRIME}/graphics"
    prime:
      - bin/graphics-core22-wrapper
