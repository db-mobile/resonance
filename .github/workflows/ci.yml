name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main, dev ]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    strategy:
      matrix:
        node-version: [22.x, 24.x]

    steps:
    - name: Checkout code
      uses: actions/checkout@v6

    - name: Setup Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v5
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Run tests with coverage
      run: npm run test:coverage

    - name: Upload coverage to Codecov
      if: matrix.node-version == '22.x'
      uses: codecov/codecov-action@v6
      with:
        files: ./coverage/lcov.info
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: false

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
    - name: Checkout code
      uses: actions/checkout@v6

    - name: Setup Node.js
      uses: actions/setup-node@v5
      with:
        node-version: '22.x'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Run linting
      run: npm run lint

  desktop:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
    - name: Checkout code
      uses: actions/checkout@v6

    - name: Install Rust stable
      uses: dtolnay/rust-toolchain@stable
      with:
        components: clippy

    - name: Rust cache
      uses: swatinem/rust-cache@v2
      with:
        workspaces: '. -> target'

    - name: Install Linux dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libssl-dev libayatana-appindicator3-dev librsvg2-dev

    - name: Setup Node.js
      uses: actions/setup-node@v5
      with:
        node-version: '22.x'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Build frontend
      run: npm run build

    - name: Run clippy
      run: cargo clippy -p resonance --locked -- -D warnings

    - name: Run Rust tests
      run: cargo test -p resonance --locked

  compile:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30

    strategy:
      matrix:
        os: [macos-14, windows-latest]

    steps:
    - name: Checkout code
      uses: actions/checkout@v6

    - name: Setup Node.js
      uses: actions/setup-node@v5
      with:
        node-version: '22.x'
        cache: 'npm'

    - name: Install Rust stable
      uses: dtolnay/rust-toolchain@stable

    - name: Ensure dtolnay cargo wins over preinstalled rustup shim (macOS)
      if: matrix.os == 'macos-14'
      run: echo "$HOME/.cargo/bin" >> $GITHUB_PATH

    - name: Rust cache
      uses: swatinem/rust-cache@v2
      with:
        workspaces: '. -> target'

    - name: Install dependencies
      run: npm ci

    - name: Build frontend
      run: npm run build:prod

    - name: Compile the desktop crate
      run: cargo build -p resonance --locked

  security:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
    - name: Checkout code
      uses: actions/checkout@v6

    - name: Setup Node.js
      uses: actions/setup-node@v5
      with:
        node-version: '22.x'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Run security audit
      run: npm audit --audit-level=moderate --omit=dev

  workspace:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
    - name: Checkout code
      uses: actions/checkout@v6

    - name: Check version agreement
      run: python3 scripts/check-version.py

    - name: Install Rust stable
      uses: dtolnay/rust-toolchain@stable
      with:
        components: clippy, rustfmt

    - name: Rust cache
      uses: swatinem/rust-cache@v2
      with:
        workspaces: '. -> target'

    - name: Check dependency boundary of the headless crates
      run: |
        for crate in resonance-core resonance-collections resonance-cli; do
          cargo tree -p "$crate" --locked --prefix none > "deps-$crate.txt"
          if grep -Ei '^(tauri|gtk|gdk|webkit|javascriptcore|keyring|oo7|secret-service|security-framework|windows-credentials|openssl-sys)([- ]|$)' "deps-$crate.txt"; then
            echo "$crate must not depend on desktop libraries."
            exit 1
          fi
        done

    - name: Check formatting
      run: cargo fmt --all -- --check

    - name: Run clippy
      run: cargo clippy -p resonance-core -p resonance-collections -p resonance-cli --locked --all-targets -- -D warnings

    - name: Build without frontend assets or desktop dependencies
      run: cargo build -p resonance-core -p resonance-collections -p resonance-cli --locked

    - name: Run tests
      run: cargo test -p resonance-core -p resonance-collections -p resonance-cli --locked

  cli-static:
    runs-on: ubuntu-22.04
    timeout-minutes: 20

    steps:
    - name: Checkout code
      uses: actions/checkout@v6

    - name: Install Rust stable
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: x86_64-unknown-linux-musl

    - name: Rust cache
      uses: swatinem/rust-cache@v2
      with:
        workspaces: '. -> target'
        key: cli-x86_64-unknown-linux-musl

    - name: Install musl toolchain
      run: |
        sudo apt-get update
        sudo apt-get install -y musl-tools
        echo "CC_x86_64_unknown_linux_musl=musl-gcc" >> $GITHUB_ENV

    - name: Build static command-line binary
      run: cargo build -p resonance-cli --profile cli --target x86_64-unknown-linux-musl --locked

    - name: Check the binary is static and runs
      run: |
        BIN=target/x86_64-unknown-linux-musl/cli/resonance
        file "$BIN"
        if ldd "$BIN" 2>&1 | grep -q '=>'; then
          echo "The CLI binary must not link shared libraries."
          exit 1
        fi
        "$BIN" --version

  install-script:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-14]

    runs-on: ${{ matrix.os }}
    timeout-minutes: 15

    steps:
    - name: Checkout code
      uses: actions/checkout@v6

    - name: Install shellcheck (macOS)
      if: runner.os == 'macOS'
      run: command -v shellcheck || brew install shellcheck

    - name: Lint shell scripts
      run: |
        shellcheck -s sh install.sh
        shellcheck scripts/test-install.sh

    - name: Test the install script against a local release
      run: scripts/test-install.sh

  action-smoke:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-14, windows-latest]

    runs-on: ${{ matrix.os }}
    timeout-minutes: 15

    steps:
    - name: Checkout code
      uses: actions/checkout@v6

    - name: Install a pinned version with the action
      id: pinned
      uses: ./
      with:
        version: 3.5.0

    - name: Check the pinned version
      shell: bash
      run: |
        resonance --version | grep -F 'resonance 3.5.0'
        [ "${{ steps.pinned.outputs.version }}" = "3.5.0" ]
        [ -n "${{ steps.pinned.outputs.path }}" ]

    - name: Install the latest version into a separate directory
      if: runner.os == 'Linux'
      id: latest
      uses: ./
      with:
        install-dir: ${{ runner.temp }}/resonance-latest

    - name: Check the latest version
      if: runner.os == 'Linux'
      shell: bash
      run: |
        "${{ steps.latest.outputs.path }}/resonance" --version
        [ -n "${{ steps.latest.outputs.version }}" ]

  ci:
    name: ci
    needs: [test, lint, desktop, compile, security, workspace, cli-static, install-script, action-smoke]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
    - name: Fail when any job failed or was cancelled
      if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
      run: exit 1
