name: Standalone execution core

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, dev]

jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Check shipped dependency resolution and version
        run: |
          python3 scripts/test-core-resolution.py
          python3 scripts/check-core-resolution.py
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: crates/resonance-core -> target
      - name: Check dependency boundary
        run: |
          cargo tree --manifest-path crates/resonance-core/Cargo.toml --locked --prefix none > core-dependencies.txt
          if grep -Ei '^(tauri|gtk|gdk|webkit|javascriptcore|keyring|oo7|secret-service|security-framework|windows-credentials)([- ]|$)' core-dependencies.txt; then
            echo 'The execution core must not depend on desktop libraries.'
            exit 1
          fi
      - name: Format
        run: cargo fmt --manifest-path crates/resonance-core/Cargo.toml -- --check
      - name: Lint
        run: cargo clippy --manifest-path crates/resonance-core/Cargo.toml --locked --all-targets -- -D warnings
      - name: Build without frontend assets or desktop dependencies
        run: cargo build --manifest-path crates/resonance-core/Cargo.toml --locked
      - name: Test
        run: cargo test --manifest-path crates/resonance-core/Cargo.toml --locked
