[package]
name = "resonance"
description = "A local-first, zero-account API client with excellent user experience"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true

[build-dependencies]
tauri-build = { version = "2.7", features = [] }
tonic-prost-build = "0.14"
prost-build = "0.14"
protoc-bin-vendored = "3"

[dependencies]
resonance-core.workspace = true
resonance-collections.workspace = true
# Tauri defaults minus `dynamic-acl` (no runtime capabilities; required for
# build.removeUnusedCommands). Recheck this list against the defaults on Tauri upgrades.
tauri = { version = "2.12", default-features = false, features = ["wry", "compression", "common-controls-v6", "x11", "dbus"] }
tauri-plugin-store = "2"
tauri-plugin-dialog = "2"
tauri-plugin-window-state = "2"
# Releases use raw NSIS installers/AppImages; legacy ZIP/tar.gz support would
# pull in yanked zip 4.x releases. macOS .app.tar.gz support is unconditional.
tauri-plugin-updater = { version = "2.13.2", default-features = false, features = ["rustls-tls", "system-proxy"] }

# HTTP client (versions and features in the workspace manifest).
reqwest.workspace = true
tokio.workspace = true
tokio-tungstenite.workspace = true
futures-util.workspace = true
# MQTT client (async, rustls to match project TLS stack — no OpenSSL).
# use-rustls-no-provider instead of use-rustls: the latter enables
# tokio-rustls default features, which statically link the aws-lc-rs crypto
# provider alongside ring (megabytes of duplicate crypto in the binary).
rumqttc = { version = "0.25", default-features = false, features = ["use-rustls-no-provider"] }

# gRPC client (rustls-only TLS via tls-ring; keep the tree OpenSSL-free)
tonic = { version = "0.14", default-features = false, features = ["codegen", "channel", "tls-ring", "tls-native-roots"] }
prost = "0.14"
prost-types = "0.14"
tonic-prost = "0.14"
tokio-stream = "0.1"
prost-reflect = { version = "0.16", features = ["serde"] }
bytes.workspace = true
http.workspace = true
base64.workspace = true
hyper-util.workspace = true

# Serialization
serde.workspace = true
serde_json.workspace = true
serde_yaml_ng.workspace = true
# Validate user-provided schemas locally; no HTTP/file retrieval or extra TLS provider.
jsonschema = { version = "0.60", default-features = false, features = ["idna"] }
# Local response queries (no script evaluation or external document retrieval).
serde_json_path = "0.7"
sxd-document = "0.3"
sxd-xpath = "0.4"
quick-xml = "0.42"

# Mock server
axum.workspace = true
tower.workspace = true

# TLS for connection timing measurement
tokio-rustls.workspace = true
rustls.workspace = true

# Utilities
uuid.workspace = true
chrono.workspace = true
thiserror.workspace = true
tracing.workspace = true
regex.workspace = true
url.workspace = true
sha2.workspace = true

# Cryptographic RNG for OAuth PKCE verifiers and CSRF state (OS entropy, OpenSSL-free)
getrandom.workspace = true

# Proto file parsing (pure Rust; bundles the well-known types, no protoc needed)
protox = "0.10"


# Opens a collection directory in the platform file manager ("Show in file manager");
# pure Rust, no network or TLS dependencies.
open = "5"

# OS keychain for secret storage (encryption at rest). Pinned OpenSSL-free to match the
# project's rustls/ring-only TLS stack: Linux uses the D-Bus Secret Service with RustCrypto
# (zbus, no OpenSSL); macOS/Windows use their native credential stores.

[target.'cfg(target_os = "linux")'.dependencies]
# Use the native content/surface sizes to compensate GTK client-side decorations
# when restoring the window-state plugin's saved bounds.
gtk = "0.18"
keyring = { version = "3", default-features = false, features = ["sync-secret-service", "crypto-rust"] }
# Secret portal backend, used only when running inside a Flatpak sandbox so the app can
# encrypt secrets at rest without a `--talk-name=org.freedesktop.secrets` permission
# (which flags the app as using a non-portal service on Flathub). `native_crypto` is the
# RustCrypto backend (the `openssl_crypto` feature is the OpenSSL one) — keep it that way
# to match the project's OpenSSL-free tree; verify with `cargo tree -i openssl-sys`.
oo7 = { version = "0.3", default-features = false, features = ["tokio", "native_crypto"] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", default-features = false, features = ["apple-native"] }

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3", default-features = false, features = ["windows-native"] }

[dev-dependencies]
# Temp dirs that clean themselves up even when a test panics, which the
# hand-rolled temp_dir().join(Uuid) pattern in fs_secure.rs does not.
tempfile.workspace = true
# Mock runtime, so transports that emit events can be driven end to end.
tauri = { version = "2.12", default-features = false, features = ["wry", "compression", "common-controls-v6", "x11", "dbus", "test"] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

# Release profiles live in the workspace manifest at the repository root.
