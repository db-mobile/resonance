[package]
name = "resonance"
version = "3.1.10"
description = "A local-first, zero-account API client with excellent user experience"
authors = ["Dennis Blümer <dennis.bluemer@ducart.de>"]
license = "MIT"
repository = "https://github.com/db-mobile/resonance"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }
tonic-build = "0.13"
protoc-bin-vendored = "3"

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-store = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-shell = "2"
tauri-plugin-window-state = "2"
tauri-plugin-updater = "2"

# HTTP client. rustls-no-provider instead of plain rustls: the latter would
# statically link the aws-lc-rs crypto provider; ring is installed as the
# process default in main(). Root verification uses the OS trust store via
# rustls-platform-verifier (0.12's rustls-tls bundled webpki-roots instead).
reqwest = { version = "0.13", default-features = false, features = ["json", "multipart", "form", "rustls-no-provider", "http2", "gzip", "brotli", "socks"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "io-util"] }
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"] }
futures-util = "0.3"
# MQTT client (async, rustls to match project TLS stack — no OpenSSL).
# use-rustls-no-provider instead of use-rustls: the latter enables
# tokio-rustls default features, which statically link the aws-lc-rs crypto
# provider alongside ring (megabytes of duplicate crypto in the binary).
rumqttc = { version = "0.25", default-features = false, features = ["use-rustls-no-provider"] }

# gRPC client (rustls-only TLS via tls-ring; keep the tree OpenSSL-free)
tonic = { version = "0.13", default-features = false, features = ["codegen", "prost", "channel", "tls-ring", "tls-native-roots"] }
prost = "0.13"
prost-types = "0.13"
tokio-stream = { version = "0.1", features = ["sync"] }
prost-reflect = { version = "0.15", features = ["serde"] }
bytes = "1"
http = "1"
base64 = "0.22"
hyper-util = { version = "0.1", default-features = false, features = ["tokio"] }
rustls-pemfile = "2"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
serde_yaml_ng = "0.10"

# Mock server
axum = "0.7"
tower = { version = "0.5", features = ["util"] }

# TLS for connection timing measurement
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
webpki-roots = "0.26"

# Utilities
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
# Legacy charset decoding for response bodies (WHATWG labels, pure Rust)
encoding_rs = "0.8"
thiserror = "2"
tracing = "0.1"
regex = "1"
url = "2"
# Pin the idna→ICU4X bridge to the ICU4X 1.5 generation so url/idna share the
# icu_normalizer/icu_properties data tables boa_engine 0.19 already embeds
# (idna_adapter 1.2.1+ pulls a second, ICU4X 2.x copy of the Unicode data).
# Remove when boa_engine moves to ICU4X 2.x.
idna_adapter = "=1.2.0"

# Digest auth + AWS Signature V4
md5 = "0.7"
sha2 = "0.10"
hmac = "0.12"
hex = "0.4"

# NTLM message encoding and NTLMv2 challenge responses. Pure RustCrypto tree
# (md4, md-5, hmac, des) on non-Windows targets — no OpenSSL; verify with
# `cargo tree -i openssl-sys`.
ntlmclient = "0.2"

# Cryptographic RNG for OAuth PKCE verifiers and CSRF state (OS entropy, OpenSSL-free)
getrandom = "0.3"

# Proto file parsing
which = "6"

# JavaScript engine for script execution
boa_engine = "0.19"

# OS keychain for secret storage (encryption at rest). Pinned OpenSSL-free to match the
# project's rustls/ring-only TLS stack: Linux uses the D-Bus Secret Service with RustCrypto
# (zbus, no OpenSSL); macOS/Windows use their native credential stores.
[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3", default-features = false, features = ["sync-secret-service", "crypto-rust"] }
# Secret portal backend, used only when running inside a Flatpak sandbox so the app can
# encrypt secrets at rest without a `--talk-name=org.freedesktop.secrets` permission
# (which flags the app as using a non-portal service on Flathub). `native_crypto` is the
# RustCrypto backend (the `openssl_crypto` feature is the OpenSSL one) — keep it that way
# to match the project's OpenSSL-free tree; verify with `cargo tree -i openssl-sys`.
oo7 = { version = "0.3", default-features = false, features = ["tokio", "native_crypto"] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", default-features = false, features = ["apple-native"] }

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3", default-features = false, features = ["windows-native"] }

[dev-dependencies]
# Temp dirs that clean themselves up even when a test panics, which the
# hand-rolled temp_dir().join(Uuid) pattern in fs_secure.rs does not.
tempfile = "3"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
opt-level = "z"    # Optimize for binary size
lto = true         # Link-time optimization
codegen-units = 1  # Maximize cross-module optimization (slower compile)
strip = true       # Strip symbols from the binary
# panic = "abort" intentionally omitted: the Boa script sandbox relies on
# unwinding worker-thread panics, which abort would escalate to a full crash.
