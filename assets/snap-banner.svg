<svg width="2160" height="720" viewBox="0 0 2160 720" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1257ab" />
      <stop offset="100%" stop-color="#0c4285" />
    </linearGradient>
    <linearGradient id="iconBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1b63bd" />
      <stop offset="100%" stop-color="#0f4b94" />
    </linearGradient>
    <linearGradient id="w1" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#f6d32d" />
      <stop offset="100%" stop-color="#f9f06b" />
    </linearGradient>
    <linearGradient id="w2" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.94" />
      <stop offset="100%" stop-color="#f6f5f4" stop-opacity="0.9" />
    </linearGradient>
    <linearGradient id="w3" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#99c1f1" />
      <stop offset="100%" stop-color="#62a0ea" />
    </linearGradient>
    <radialGradient id="core" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f6f5f4" />
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#041a3a" flood-opacity="0.45" />
    </filter>
    <clipPath id="frame"><rect width="2160" height="720" /></clipPath>
  </defs>

  <rect width="2160" height="720" fill="url(#bg)" />

  <!-- large decorative rings echoing the icon, bleeding off the right edge -->
  <g fill="none" stroke-linecap="round" opacity="0.13" transform="translate(1990 360) scale(1.05)">
    <circle r="288" stroke="#f6d32d" stroke-width="56" stroke-dasharray="1165 645" stroke-dashoffset="235" transform="rotate(-28)" />
    <circle r="208" stroke="#ffffff" stroke-width="48" stroke-dasharray="760 548" stroke-dashoffset="146" transform="rotate(34)" />
    <circle r="132" stroke="#99c1f1" stroke-width="40" stroke-dasharray="472 358" stroke-dashoffset="82" transform="rotate(-18)" />
  </g>

  <!-- app icon -->
  <g transform="translate(150 150)" filter="url(#shadow)">
    <rect width="420" height="420" rx="64" fill="url(#iconBg)" />
    <g fill="none" stroke-linecap="round" transform="translate(210 210) scale(0.629)">
      <circle r="288" stroke="url(#w1)" stroke-width="56" stroke-dasharray="1165 645" stroke-dashoffset="235" transform="rotate(-28)" />
      <circle r="208" stroke="url(#w2)" stroke-width="48" stroke-dasharray="760 548" stroke-dashoffset="146" transform="rotate(34)" />
      <circle r="132" stroke="url(#w3)" stroke-width="40" stroke-dasharray="472 358" stroke-dashoffset="82" transform="rotate(-18)" />
    </g>
    <circle cx="210" cy="210" r="58" fill="url(#core)" />
    <circle cx="210" cy="210" r="14" fill="#073364" fill-opacity="0.12" />
  </g>

  <!-- wordmark -->
  <g font-family="Adwaita Sans" fill="#ffffff">
    <text x="680" y="338" font-size="176" font-weight="700" letter-spacing="-4">Resonance</text>
    <text x="684" y="440" font-size="60" font-weight="500" fill="#dbe8fa">Test and explore web services</text>
    <text x="684" y="528" font-size="40" font-weight="400" fill="#99c1f1" letter-spacing="2">REST · GraphQL · gRPC · WebSocket · SSE · MQTT</text>
  </g>
</svg>
