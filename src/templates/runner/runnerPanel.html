<template id="tpl-runner-tab-content">
    <div class="runner-panel">
        <!-- Runner Header -->
        <div class="runner-header">
            <div class="runner-title-section">
                <div class="runner-selector-wrapper">
                    <div class="runner-selector" data-role="runner-selector">
                        <input type="text"
                               class="runner-selector-input"
                               placeholder="Untitled Runner"
                               data-i18n="runner.untitled"
                               data-role="runner-name"
                               aria-label="Runner name"
                               autocomplete="off">
                        <button class="runner-selector-toggle" data-action="toggle-dropdown" aria-label="Select runner">
                            <span class="icon icon-14 icon-chevron-down"></span>
                        </button>
                    </div>
                    <div class="runner-selector-dropdown dropdown-panel is-hidden" data-role="runner-dropdown">
                        <div class="runner-dropdown-list dropdown-list" data-role="runner-list">
                            <div class="runner-dropdown-empty dropdown-empty">No saved runners</div>
                        </div>
                    </div>
                </div>
                <div class="runner-file-actions">
                    <button class="btn btn-icon runner-icon-btn is-primary" data-action="new-runner" title="New Runner" aria-label="New Runner">
                        <span class="icon icon-14 icon-plus"></span>
                    </button>
                    <button class="btn btn-icon runner-icon-btn" data-action="save-runner" title="Save Runner" aria-label="Save Runner">
                        <span class="icon icon-14 icon-save"></span>
                    </button>
                    <button class="btn btn-icon runner-icon-btn is-danger" data-action="delete-runner" title="Delete Runner" aria-label="Delete Runner">
                        <span class="icon icon-14 icon-trash"></span>
                    </button>
                    <div class="runner-menu-wrapper">
                        <button class="btn btn-icon runner-icon-btn"
                                data-action="toggle-history"
                                data-i18n-title="runner.history"
                                data-i18n-aria="runner.history"
                                title="Run history"
                                aria-label="Run history"
                                aria-haspopup="menu"
                                aria-expanded="false">
                            <span class="icon icon-14 icon-history"></span>
                        </button>
                        <div class="runner-menu-dropdown runner-history-dropdown dropdown-panel is-hidden" data-role="history-dropdown" role="menu">
                            <div class="dropdown-list" data-role="history-list"></div>
                        </div>
                    </div>
                </div>
                <div class="runner-config">
                    <label class="runner-chip toggle-switch">
                        <input type="checkbox" data-option="stop-on-error" checked>
                        <span class="toggle-track"></span>
                        <span data-i18n="runner.stop_on_error">Stop on error</span>
                    </label>
                    <div class="runner-chip">
                        <span class="runner-chip-label" data-i18n="runner.iterations">Iterations</span>
                        <input type="number"
                               class="runner-delay-input-sm"
                               data-option="iterations"
                               value="1"
                               min="1"
                               max="1000"
                               aria-label="Iterations"
                               data-i18n-aria="runner.iterations">
                    </div>
                    <div class="runner-chip">
                        <span class="runner-chip-label" data-i18n="runner.delay">Delay</span>
                        <input type="number"
                               class="runner-delay-input-sm"
                               data-option="delay"
                               value="0"
                               min="0"
                               max="10000"
                               aria-label="Delay in milliseconds">
                        <span>ms</span>
                    </div>
                    <div class="runner-chip runner-data-chip" data-role="data-chip">
                        <span class="runner-chip-label" data-i18n="runner.data_file">Data</span>
                        <button type="button"
                                class="runner-data-file-btn"
                                data-action="pick-data-file"
                                data-i18n-title="runner.pick_data_file"
                                title="Choose a CSV or JSON file">
                            <span data-role="data-file-label" data-i18n="runner.no_data_file">None</span>
                        </button>
                        <button type="button"
                                class="runner-data-clear-btn is-hidden"
                                data-action="clear-data-file"
                                data-i18n-title="runner.clear_data_file"
                                data-i18n-aria="runner.clear_data_file"
                                title="Remove data file"
                                aria-label="Remove data file">
                            <span class="icon icon-14 icon-x"></span>
                        </button>
                    </div>
                </div>
                <div class="runner-header-controls">
                    <button class="btn btn-primary runner-run-btn" data-action="run" aria-label="Run Collection">
                        <span class="icon icon-16 icon-play"></span>
                        <span data-i18n="runner.run">Run</span>
                    </button>
                    <button class="btn btn-danger is-hidden" data-action="stop" aria-label="Stop Run">
                        <span class="icon icon-16 icon-x"></span>
                        <span data-i18n="runner.stop">Stop</span>
                    </button>
                </div>
            </div>
        </div>

        <!-- Runner Main Content -->
        <div class="runner-main">
            <!-- Left Panel: Request Selection -->
            <div class="runner-selection-panel">
                <div class="runner-panel-header u-flex u-items-center u-justify-between">
                    <h4 class="runner-section-title" data-i18n="runner.available_requests">Available Requests</h4>
                </div>
                <div class="runner-collection-tree" data-role="collection-tree">
                    <div class="empty-state-base runner-empty-state">
                        <span class="icon icon-20 icon-spark"></span>
                        <p data-i18n="runner.no_collections">No collections available</p>
                    </div>
                </div>
            </div>

            <div class="runner-main-resizer" data-role="main-resizer" aria-hidden="true"></div>

            <!-- Center Panel: Selected Requests -->
            <div class="runner-requests-panel">
                <div class="runner-panel-header u-flex u-items-center u-justify-between">
                    <h4 class="runner-section-title" data-i18n="runner.selected_requests">Selected Requests</h4>
                    <span class="runner-request-count" data-role="request-count">0 requests</span>
                </div>
                <div class="runner-requests-list" data-role="requests-list">
                    <div class="empty-state-base runner-empty-state">
                        <span class="icon icon-20 icon-plus"></span>
                        <p data-i18n="runner.add_requests_hint">Click requests from the left panel to add them</p>
                    </div>
                </div>
            </div>
        </div>

    </div>
</template>

<template id="tpl-runner-script-modal">
    <div class="modal-overlay modal-overlay--dim" data-role="script-modal-overlay">
        <div class="modal-dialog modal-dialog--script-editor">
            <div class="dialog-header">
                <div class="runner-script-modal-title u-flex u-flex-col">
                    <h3 class="dialog-title" data-i18n="runner.edit_request">Edit Request</h3>
                    <div class="runner-script-request-info u-flex u-items-center u-gap-2">
                        <span class="method-pill" data-role="script-method">GET</span>
                        <span class="runner-script-path" data-role="script-path">/endpoint</span>
                    </div>
                </div>
                <button class="dialog-close-btn" data-action="close" aria-label="Close">
                    <span class="icon icon-16 icon-x"></span>
                </button>
            </div>
            <div class="runner-editor-tabs">
                <button class="runner-editor-tab is-active" data-edit-tab="params" data-i18n="runner.tab_params">Params</button>
                <button class="runner-editor-tab" data-edit-tab="headers" data-i18n="runner.tab_headers">Headers</button>
                <button class="runner-editor-tab" data-edit-tab="body" data-i18n="runner.tab_body">Body</button>
                <button class="runner-editor-tab" data-edit-tab="script" data-i18n="runner.tab_script">Script</button>
            </div>
            <div class="runner-editor-body">
                <div class="runner-editor-tab-content is-active" data-edit-content="params">
                    <div class="runner-editor-section">
                        <div class="runner-editor-section-header u-flex u-items-center u-justify-between">
                            <h4 class="runner-editor-section-title" data-i18n="runner.path_params">Path Parameters</h4>
                            <button class="btn btn-sm btn-outline" data-action="add-path-param" data-i18n="runner.add_param">+ Add</button>
                        </div>
                        <div class="key-value-list" data-role="path-params-list"></div>
                    </div>
                    <div class="runner-editor-section">
                        <div class="runner-editor-section-header u-flex u-items-center u-justify-between">
                            <h4 class="runner-editor-section-title" data-i18n="runner.query_params">Query Parameters</h4>
                            <button class="btn btn-sm btn-outline" data-action="add-query-param" data-i18n="runner.add_param">+ Add</button>
                        </div>
                        <div class="key-value-list" data-role="query-params-list"></div>
                    </div>
                </div>
                <div class="runner-editor-tab-content" data-edit-content="headers">
                    <div class="runner-editor-section">
                        <div class="runner-editor-section-header u-flex u-items-center u-justify-between">
                            <h4 class="runner-editor-section-title" data-i18n="runner.headers">Headers</h4>
                            <button class="btn btn-sm btn-outline" data-action="add-header" data-i18n="runner.add_header">+ Add</button>
                        </div>
                        <div class="key-value-list" data-role="headers-list"></div>
                    </div>
                </div>
                <div class="runner-editor-tab-content" data-edit-content="body">
                    <div class="runner-editor-body-host" data-role="override-body-container"></div>
                </div>
                <div class="runner-editor-tab-content" data-edit-content="script">
                    <div class="runner-script-editor-container" data-role="script-editor-container"></div>
                    <div class="runner-script-modal-hint">
                        <strong>Available APIs:</strong> response, environment.set(), environment.get(), console.log(), sendRequest()
                    </div>
                </div>
            </div>
            <div class="runner-script-modal-footer dialog-footer dialog-footer--divided">
                <button class="btn btn-outline" data-action="cancel" data-i18n="common.cancel">Cancel</button>
                <button class="btn btn-primary" data-action="save" data-i18n="common.save">Save</button>
            </div>
        </div>
    </div>
</template>

<template id="tpl-runner-kv-row">
    <div class="key-value-row">
        <input type="text" class="key-input" data-role="kv-key" autocomplete="off">
        <input type="text" class="value-input" data-role="kv-value" autocomplete="off">
        <button class="runner-request-remove-btn" data-action="remove-kv" title="Remove" aria-label="Remove">
            <span class="icon icon-14 icon-x"></span>
        </button>
    </div>
</template>

<template id="tpl-runner-request-item">
    <div class="runner-request-item" draggable="true">
        <div class="runner-request-drag-handle">
            <span class="icon icon-14 icon-menu"></span>
        </div>
        <div class="u-flex u-flex-1 u-items-center u-gap-2 u-overflow-hidden u-min-w-0">
            <span class="method-pill" data-role="method">GET</span>
            <span class="runner-request-name" data-role="name">/endpoint</span>
        </div>
        <div class="runner-request-actions u-flex">
            <button class="runner-request-edit-btn" data-action="edit-script" data-i18n-title="runner.edit_request" title="Edit request">
                <span class="icon icon-14 icon-script"></span>
            </button>
            <button class="runner-request-remove-btn" data-action="remove" title="Remove">
                <span class="icon icon-14 icon-x"></span>
            </button>
        </div>
    </div>
</template>

<template id="tpl-runner-collection-item">
    <div class="runner-collection-item">
        <div class="runner-collection-header u-flex u-items-center u-gap-2" data-role="collection-header">
            <span class="icon icon-14 icon-chevron-right runner-collection-chevron"></span>
            <span class="runner-collection-name" data-role="collection-name">Collection Name</span>
            <button class="runner-endpoint-add-btn" data-action="add-all" data-i18n-title="runner.add_all" data-i18n-aria="runner.add_all" title="Add all requests" aria-label="Add all requests">
                <span class="icon icon-14 icon-plus"></span>
            </button>
        </div>
        <div class="runner-collection-endpoints is-hidden" data-role="endpoints-container">
        </div>
    </div>
</template>

<template id="tpl-runner-endpoint-item">
    <div class="runner-endpoint-item u-flex u-items-center u-gap-2" data-role="endpoint">
        <span class="method-pill" data-role="method">GET</span>
        <span class="runner-endpoint-name" data-role="name">/endpoint</span>
        <button class="runner-endpoint-add-btn" data-action="add" title="Add to runner">
            <span class="icon icon-14 icon-plus"></span>
        </button>
    </div>
</template>

<template id="tpl-runner-results-panel">
    <div class="runner-results-resizer" data-role="results-resizer">
        <div class="resizer-grip u-flex u-items-center u-justify-center">
            <div class="resizer-line"></div>
            <div class="resizer-line"></div>
            <div class="resizer-line"></div>
        </div>
    </div>
    <div class="runner-results-container">
        <div class="runner-results-header u-flex u-items-center u-justify-between">
            <div class="u-flex u-items-center u-gap-2 u-min-w-0">
                <h4 class="runner-section-title" data-i18n="runner.results">Results</h4>
                <span class="runner-results-source is-hidden" data-role="results-source"></span>
            </div>
            <div class="runner-results-summary" data-role="summary">
                <div class="runner-stat runner-results-passed">
                    <span class="runner-stat-value" data-role="passed">0</span>
                    <span class="runner-stat-label" data-i18n="runner.passed">Passed</span>
                </div>
                <div class="runner-stat runner-results-failed">
                    <span class="runner-stat-value" data-role="failed">0</span>
                    <span class="runner-stat-label" data-i18n="runner.failed">Failed</span>
                </div>
                <div class="runner-stat runner-results-skipped">
                    <span class="runner-stat-value" data-role="skipped">0</span>
                    <span class="runner-stat-label" data-i18n="runner.skipped">Skipped</span>
                </div>
                <div class="runner-stat runner-results-time">
                    <span class="runner-stat-value" data-role="total-time">—</span>
                    <span class="runner-stat-label" data-i18n="runner.total">Total</span>
                </div>
            </div>
            <div class="runner-menu-wrapper">
                <button class="btn btn-sm btn-outline"
                        data-action="toggle-export"
                        aria-haspopup="menu"
                        aria-expanded="false"
                        disabled>
                    <span class="icon icon-14 icon-export"></span>
                    <span data-i18n="runner.export">Export</span>
                </button>
                <div class="runner-menu-dropdown runner-export-dropdown dropdown-panel is-hidden" data-role="export-menu" role="menu">
                    <button class="dropdown-item" data-export="json" role="menuitem">
                        <span class="dropdown-item-label" data-i18n="runner.export_json">JSON report</span>
                    </button>
                    <button class="dropdown-item" data-export="junit" role="menuitem">
                        <span class="dropdown-item-label" data-i18n="runner.export_junit">JUnit XML</span>
                    </button>
                </div>
            </div>
        </div>
        <div class="runner-results-body u-flex u-flex-1 u-overflow-hidden u-min-h-0">
            <div class="runner-results-list-panel">
                <div class="runner-results-list" data-role="results-list">
                </div>
            </div>
            <div class="runner-results-detail-panel is-hidden" data-role="detail-panel">
                <div class="runner-results-detail-header">
                    <div class="runner-results-detail-info u-flex u-items-center u-gap-2">
                        <span class="method-pill" data-role="detail-method">GET</span>
                        <span class="runner-results-detail-name" data-role="detail-name">/endpoint</span>
                        <span class="runner-results-detail-status" data-role="detail-status">200 OK</span>
                        <span class="runner-results-detail-time" data-role="detail-time">0ms</span>
                    </div>
                    <div class="runner-results-error is-hidden" data-role="detail-error" role="alert"></div>
                </div>
                <div class="runner-results-detail-tabs">
                    <button class="runner-results-tab is-active" data-tab="body" data-i18n="runner.body">Body</button>
                    <button class="runner-results-tab" data-tab="headers" data-i18n="runner.headers">Headers</button>
                    <button class="runner-results-tab" data-tab="cookies" data-i18n="runner.cookies">Cookies</button>
                    <button class="runner-results-tab" data-tab="tests">
                        <span data-i18n="runner.tests">Tests</span>
                        <span class="runner-results-tab-count" data-role="tests-count"></span>
                    </button>
                    <button class="runner-results-tab" data-tab="console">
                        <span data-i18n="runner.console">Console</span>
                        <span class="runner-results-tab-count" data-role="logs-count"></span>
                    </button>
                </div>
                <div class="runner-results-detail-content">
                    <div class="runner-results-tab-content is-active" data-content="body">
                        <pre class="runner-results-body-content" data-role="body-content"></pre>
                    </div>
                    <div class="runner-results-tab-content" data-content="headers">
                        <table class="runner-results-headers-table" data-role="headers-table">
                            <thead>
                                <tr>
                                    <th data-i18n="runner.header_name">Name</th>
                                    <th data-i18n="runner.header_value">Value</th>
                                </tr>
                            </thead>
                            <tbody data-role="headers-body"></tbody>
                        </table>
                    </div>
                    <div class="runner-results-tab-content" data-content="cookies">
                        <table class="runner-results-cookies-table" data-role="cookies-table">
                            <thead>
                                <tr>
                                    <th data-i18n="runner.cookie_name">Name</th>
                                    <th data-i18n="runner.cookie_value">Value</th>
                                    <th data-i18n="runner.cookie_domain">Domain</th>
                                    <th data-i18n="runner.cookie_path">Path</th>
                                </tr>
                            </thead>
                            <tbody data-role="cookies-body"></tbody>
                        </table>
                        <div class="runner-results-no-cookies is-hidden" data-role="no-cookies">
                            <span data-i18n="runner.no_cookies">No cookies in response</span>
                        </div>
                    </div>
                    <div class="runner-results-tab-content" data-content="tests">
                        <ul class="runner-results-tests" data-role="tests-list"></ul>
                        <div class="runner-results-empty is-hidden" data-role="no-tests">
                            <span data-i18n="runner.no_tests">No tests ran for this request</span>
                        </div>
                    </div>
                    <div class="runner-results-tab-content" data-content="console">
                        <div class="runner-results-console" data-role="console-list"></div>
                        <div class="runner-results-empty is-hidden" data-role="no-logs">
                            <span data-i18n="runner.no_logs">No console output</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</template>

<template id="tpl-runner-result-item">
    <div class="runner-result-item" data-role="result-item">
        <div class="runner-result-header u-flex u-items-center u-gap-2">
            <span class="runner-result-status" data-role="status-icon">●</span>
            <span class="method-pill" data-role="method">GET</span>
            <span class="runner-result-name" data-role="name">/endpoint</span>
            <span class="runner-result-status-code" data-role="status-code">200</span>
            <span class="runner-result-time" data-role="time">0ms</span>
        </div>
    </div>
</template>
