<template id="tpl-example-row">
    <div class="row example-row" role="listitem">
        <span class="status-display example-status"></span>
        <div class="row-content">
            <span class="title example-name"></span>
            <span class="subtitle example-meta"></span>
        </div>
        <div class="suffix example-actions">
            <button type="button" class="button flat small" data-action="view"><span class="icon icon-16 icon-eye" aria-hidden="true"></span></button>
            <button type="button" class="button flat small" data-action="rename"><span class="icon icon-16 icon-pencil" aria-hidden="true"></span></button>
            <button type="button" class="button flat small" data-action="delete"><span class="icon icon-16 icon-trash" aria-hidden="true"></span></button>
        </div>
    </div>
</template>
