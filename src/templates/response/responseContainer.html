<template id="tpl-response-container">
    <div class="workspace-tab-response u-flex u-flex-col is-hidden">
        <div class="tab-content active" role="tabpanel" data-role="response-body">
            <div class="response-toolbar u-flex u-items-center">
                <div class="language-selector-container">
                    <select class="language-selector" aria-label="Syntax Highlighting Language" title="Syntax Highlighting">
                        <option value="json">JSON</option>
                        <option value="xml">XML</option>
                        <option value="html">HTML</option>
                        <option value="text">Plain Text</option>
                    </select>
                    <span class="select-arrow icon icon-12 icon-chevron-down"></span>
                </div>
                <div class="preview-mode-buttons">
                    <button class="preview-mode-btn active" data-mode="code" aria-label="Code View" title="Code View">
                        <span>Code</span>
                    </button>
                    <button class="preview-mode-btn" data-mode="preview" aria-label="Preview View" title="Preview View">
                        <span>Preview</span>
                    </button>
                    <button class="preview-mode-btn" data-mode="results" aria-pressed="false" data-inspection-text="results">Results</button>
                </div>
                <button class="copy-btn copy-response-btn" aria-label="Copy Response" title="Copy Response Body">
                    <span class="icon icon-16 icon-copy"></span>
                </button>
                <button class="copy-btn save-response-btn" aria-label="Save Response" title="Save Response Body to File">
                    <span class="icon icon-16 icon-save"></span>
                </button>
            </div>
            <div class="response-body-container u-flex" aria-live="polite"></div>
            <div class="response-preview-container u-flex is-hidden"></div>
            <div class="inspection-panel is-hidden">
                <div class="inspection-controls">
                    <form class="inspection-form">
                        <label class="inspection-query-field">
                            <span class="inspection-format">JSONPath</span>
                            <input class="inspection-expression" type="text" autocomplete="off" spellcheck="false" maxlength="4096" aria-label="Query expression">
                        </label>
                        <div class="inspection-query-actions">
                            <button class="inspection-apply" type="submit" data-inspection-text="apply">Apply</button>
                            <button class="inspection-clear" type="button" data-inspection-text="clear">Clear</button>
                        </div>
                    </form>
                    <details class="inspection-namespace-options is-hidden">
                        <summary data-inspection-text="namespaces">Namespace overrides</summary>
                        <p data-inspection-text="namespaceHelp"></p>
                        <textarea class="inspection-namespaces" rows="3" spellcheck="false" aria-label="Namespace overrides"></textarea>
                        <p data-inspection-text="bindings"></p>
                        <pre class="inspection-bindings"></pre>
                    </details>
                </div>
                <div class="inspection-result-toolbar">
                    <span class="inspection-status" role="status" aria-live="polite"></span>
                    <div class="inspection-export-actions">
                        <button class="inspection-copy" type="button" data-inspection-text="copy" disabled>Copy Results</button>
                        <button class="inspection-save" type="button" data-inspection-text="save" disabled>Save Results</button>
                    </div>
                </div>
                <div class="inspection-editor" role="region" aria-label="Query results"></div>
            </div>
        </div>

        <div class="tab-content" role="tabpanel" data-role="response-headers">
            <div class="response-toolbar u-flex u-items-center">
                <button class="copy-btn copy-headers-btn" aria-label="Copy Headers" title="Copy Response Headers">
                    <span class="icon icon-16 icon-copy"></span>
                </button>
            </div>
            <div class="response-headers-display u-flex" aria-live="polite"></div>
        </div>

        <div class="tab-content" role="tabpanel" data-role="response-metadata">
            <pre class="response-metadata-display" aria-live="polite"></pre>
        </div>

        <div class="tab-content" role="tabpanel" data-role="response-cookies">
            <div class="response-cookies-display" aria-live="polite"></div>
        </div>

        <div class="tab-content" role="tabpanel" data-role="response-trailers">
            <pre class="response-trailers-display" aria-live="polite"></pre>
        </div>

        <div class="tab-content" role="tabpanel" data-role="response-performance">
            <div class="response-performance-display" aria-live="polite">
                <p class="no-data">Send a request to see performance metrics</p>
            </div>
        </div>

        <div class="tab-content" role="tabpanel" data-role="response-scripts">
            <div class="script-console-container response-scripts-display" aria-live="polite"></div>
        </div>
    </div>
</template>
