<template id="tpl-dynamic-variables-reference">
    <div class="u-flex u-flex-col u-gap-4 u-overflow-hidden">
        <div class="dialog-header">
            <h2 class="dialog-title">Dynamic variables</h2>
            <button type="button" id="var-reference-close-btn" class="dialog-close-btn" aria-label="Close" data-i18n-aria="common.close"><span class="icon icon-16 icon-x"></span></button>
        </div>

        <p class="var-reference-intro">
            Generated at request time — no definition needed. The same variable resolves
            to the same value everywhere within a single request.
        </p>

        <div class="var-reference-grid"></div>
    </div>
</template>
