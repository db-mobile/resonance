<template id="tpl-keyboard-shortcuts-dialog">
    <div class="dialog-header">
        <h2 class="dialog-title" data-i18n="shortcuts.title">Keyboard Shortcuts</h2>
        <button type="button" id="close-shortcuts-btn" class="dialog-close-btn" aria-label="Close" data-i18n-aria="common.close"><span class="icon icon-16 icon-x"></span></button>
    </div>
    <div class="keyboard-shortcuts-content dialog-body" data-role="content"></div>
</template>

<template id="tpl-shortcuts-category">
    <div class="shortcuts-category">
        <h3 data-role="title"></h3>
        <div class="shortcuts-list" data-role="list"></div>
    </div>
</template>

<template id="tpl-shortcut-item">
    <div class="shortcut-item u-flex u-items-center u-justify-between">
        <span class="shortcut-description" data-role="description"></span>
        <kbd class="shortcut-keys" data-role="keys"></kbd>
    </div>
</template>
